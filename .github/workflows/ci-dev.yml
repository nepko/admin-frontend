name: Frontend CI (dev)

# 二开专用 CI：仅守护 dev 分支，避免与上游 main 的 frontend-ci.yml 冲突。
# 关键点：跑 `npm run build`（tsc -b && vite build），能在合并前抓出
# 类似 fm.tsx / security.tsx 那种导致整前端构建失败的 TS 错误。
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
